#
# https://github.com/P3TERX/Actions-OpenWrt
# File: .github/workflows/openwrt-bulder.yml
# Description: Build OpenWrt using GitHub Actions (SSH checkout)
#

name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  # 上游源码仓库（建议保留 owner/repo 形式；如无上游权限可改成你的 fork）
  SOURCE_REPO: jh0072110/OwnWRT
  REPO_BRANCH: master

  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: self-hosted
    env:
      # 保险：即使某处还走到 HTTPS，也避免 GnuTLS/VAES 踩雷
      GNUTLS_CPUID_OVERRIDE: "0"
      OPENSSL_ia32cap: "~0x200000200000000"

    steps:
    # 预热 GitHub SSH 主机指纹，避免首次连接交互
    - name: Preheat known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
        # 如你的云厂商封 22 端口，改走 443：
        # cat >> ~/.ssh/config <<'CFG'
        # Host github.com
        #   HostName ssh.github.com
        #   Port 443
        #   User git
        # CFG
        # ssh-keyscan -p 443 ssh.github.com >> ~/.ssh/known_hosts

    # 用 SSH 拉取“当前仓库”，彻底绕开 git-remote-https
    - name: Checkout (this repo via SSH)
      uses: actions/checkout@v4
      with:
        ssh-key: ${{ secrets.CHECKOUT_SSH_KEY }}
        persist-credentials: false
        fetch-depth: 1

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force || true
        # 注意：用 sudo env 把变量传进 root 进程，避免 APT 的 https 方法 SIGILL
        sudo env GNUTLS_CPUID_OVERRIDE=0 OPENSSL_ia32cap=~0x200000200000000 apt-get -qq update
        sudo env GNUTLS_CPUID_OVERRIDE=0 OPENSSL_ia32cap=~0x200000200000000 apt-get -qq install -y \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl \
          device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool \
          libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp \
          ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo env GNUTLS_CPUID_OVERRIDE=0 OPENSSL_ia32cap=~0x200000200000000 apt-get -qq autoremove --purge
        sudo env GNUTLS_CPUID_OVERRIDE=0 OPENSSL_ia32cap=~0x200000200000000 apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    # 用 SSH 拉取“上游源码”到工作区 ./openwrt 目录（不再使用 /workdir 和手写 git clone）
    - name: Clone source code (immortalwrt via SSH)
      uses: actions/checkout@v4
      with:
        repository: ${{ env.SOURCE_REPO }}     # e.g. immortalwrt/immortalwrt 或 yourname/immortalwrt
        ref: ${{ env.REPO_BRANCH }}
        path: openwrt
        ssh-key: ${{ secrets.CHECKOUT_SSH_KEY }}
        persist-credentials: false
        fetch-depth: 1

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j"$(nproc)" || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        TDIR=$(echo openwrt/bin/targets/*/*)
        if [ -d "$TDIR" ]; then
          cd "$TDIR"
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"
        else
          echo "No firmware directory found, skip organize."
        fi

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
